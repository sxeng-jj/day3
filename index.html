<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제주 날씨 맞춤 추천</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        body { margin: 0; font-family: sans-serif; }
        #bar { padding: 8px 12px; display: flex; gap: 8px; }
        #q { flex: 1; padding: 6px; font-size: 15px; }
        #panel { padding: 0 12px 6px; font-size: 14px; }
        #trace { color: #777; margin: 4px 0; }
        #answer { white-space: pre-wrap; margin: 6px 0; }
        #map { height: calc(100vh - 230px); min-height: 300px; }
    </style>
</head>
<body>
    <div id="bar">
        <input id="q" maxlength="500" placeholder="예) 내일 서귀포에서 갈 만한 곳 추천해줘">
        <button id="go">추천받기</button>
    </div>
    <div id="panel">
        <div id="trace"></div>
        <div id="answer"></div>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map("map").setView([33.38, 126.55], 10)
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: "&copy; OpenStreetMap contributors · 날씨: Open-Meteo",
            maxZoom: 18,
        }).addTo(map)
        const layer = L.layerGroup().addTo(map)

        const $ = (id) => document.getElementById(id)
        const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]))

        const ask = async () => {
            const message = $("q").value.trim()
            if (!message) return
            $("go").disabled = true
            $("trace").textContent = "에이전트가 도구를 고르는 중…"
            $("answer").textContent = ""
            try {
                const r = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "content-type": "application/json" },
                    body: JSON.stringify({ message }),
                    signal: AbortSignal.timeout(58000),
                })
                const d = await r.json()
                if (!r.ok) throw new Error((d.error || "요청 실패") + (d.detail ? " (" + d.detail + ")" : ""))

                $("trace").textContent = "사용한 도구: " +
                    (d.trace.length ? d.trace.map((t) => `${t.tool}(${JSON.stringify(t.input)})`).join(" → ") : "없음")
                $("answer").textContent = d.answer

                layer.clearLayers()
                for (const s of d.spots) {
                    L.marker([s.lat, s.lon]).addTo(layer)
                        .bindPopup(`<b>${esc(s.name)}</b><br>${esc(s.area)} · ${s.indoor ? "실내" : "야외"}<br>${esc(s.desc)}`)
                }
                if (d.spots.length) map.fitBounds(d.spots.map((s) => [s.lat, s.lon]), { padding: [40, 40] })
            } catch (e) {
                $("trace").textContent = ""
                $("answer").textContent = "오류: " + (e.name === "TimeoutError" ? "응답 시간이 초과됐습니다. 잠시 후 다시 시도하세요." : e.message)
            }
            $("go").disabled = false
        }

        $("go").onclick = ask
        $("q").onkeydown = (e) => { if (e.key === "Enter") ask() }
    </script>
</body>
</html>
