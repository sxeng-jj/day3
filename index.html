<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제주 관광지 지도</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        body { margin: 0; font-family: sans-serif; }
        #bar { padding: 8px 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        #map { height: calc(100vh - 90px); }
        #msg { padding: 0 12px 6px; color: #555; font-size: 14px; }
    </style>
</head>
<body>
    <div id="bar">
        <label>지역
            <select id="area">
                <option>동쪽</option><option>서쪽</option><option>서귀포</option><option>제주시</option>
            </select>
        </label>
        <label>실내 여부
            <select id="indoor">
                <option value="">전체</option>
                <option value="true">실내</option>
                <option value="false">야외</option>
            </select>
        </label>
        <button id="go">찾기</button>
    </div>
    <div id="msg"></div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const MAX_RESULTS = 8
        let spots = []

        // api/tools.js 의 find_spots 와 같은 규칙 (area 로 시작하면 같은 지역, 최대 8곳)
        const find_spots = ({ area, indoor }) =>
            spots
                .filter((s) => s.area.startsWith(area))
                .filter((s) => indoor === undefined || s.indoor === indoor)
                .slice(0, MAX_RESULTS)

        const map = L.map("map").setView([33.38, 126.55], 10)
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: "&copy; OpenStreetMap contributors",
            maxZoom: 18,
        }).addTo(map)
        const layer = L.layerGroup().addTo(map)

        const search = () => {
            const v = document.getElementById("indoor").value
            const found = find_spots({
                area: document.getElementById("area").value,
                indoor: v === "" ? undefined : v === "true",
            })
            layer.clearLayers()
            for (const s of found) {
                L.marker([s.lat, s.lon]).addTo(layer)
                    .bindPopup(`<b>${s.name}</b><br>${s.area} · ${s.indoor ? "실내" : "야외"}<br>${s.type}`)
            }
            document.getElementById("msg").textContent = found.length
                ? `${found.length}곳: ` + found.map((s) => s.name).join(", ")
                : "조건에 맞는 장소가 목록에 없습니다."
            if (found.length) map.fitBounds(found.map((s) => [s.lat, s.lon]), { padding: [40, 40] })
        }

        document.getElementById("go").onclick = search
        fetch("jeju_spots.json")
            .then((r) => r.json())
            .then((d) => { spots = d.spots; search() })
            .catch(() => { document.getElementById("msg").textContent = "jeju_spots.json 을 불러오지 못했습니다. 파일 더블클릭이 아니라 로컬 서버로 여세요." })
    </script>
</body>
</html>
